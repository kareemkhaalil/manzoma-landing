name: Deploy Landing Site to VPS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build & Deploy Landing to VPS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Production Site (Vite)
        run: npm run build

      - name: Deploy to VPS Web Root via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          source: "dist/*"
          target: "/www/wwwroot/manzoma.online"
          strip_components: 1

      - name: Send Telegram Notification
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            MSG="🚀 *تم نشر موقع المنظومة بنجاح على السيرفر!*

🌐 *الموقع الحي:* https://manzoma.online
📦 *المستودع:* \`${{ github.repository }}\`
🌿 *الفرع:* \`${{ github.ref_name }}\`
👤 *المطور:* ${{ github.actor }}
💬 *التعديل:* ${{ github.event.head_commit.message }}
🔗 [عرض تفاصيل العملية على جيت هب](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          else
            MSG="❌ *فشلت عملية نشر موقع المنظومة!*

📦 *المستودع:* \`${{ github.repository }}\`
👤 *المطور:* ${{ github.actor }}
🔗 [فحص سبب الفشل](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          fi

          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "parse_mode=Markdown" \
            -d "text=$MSG" || true
